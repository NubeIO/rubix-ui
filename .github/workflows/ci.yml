# CI keeps the package's structural rules true on every PR: the types and tests pass, the extension
# stylesheet stays under [data-ext-root], and the committed `dist/` matches `src/` (a git dep installs
# the tree as-is, so a stale dist ships old code under a new tag).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Extension stylesheet is scoped
        run: node scripts/assert-scoped-css.mjs
      - name: dist/ is committed and matches src/
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale. Run \`pnpm build\` and commit the result."
            git diff --stat -- dist
            exit 1
          fi
